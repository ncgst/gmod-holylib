# Keep SDK pins aligned with the supported interface ABI documented in BUILD.md.
name: Build GhostInj

on: 
  push:
    paths:
      - '.github/workflows/compile-ghostinj.yml'
      - 'ghostinj-dll/source/**'
      - 'ghostinj-dll/premake5.lua'
  pull_request:
  workflow_dispatch:

jobs:
  build_ghostinj:
    name: "Build GhostInj"
    uses: ncgst/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      PROJECT_PATH: "ghostinj-dll/"
      PROJECT_NAME: "ghostinj"
      BUILD_64x: "true"
      LINUX_FILEEXTENTION: "dll"
      BUILD_WINDOWS: "false"
      USE_PREFIX: "false"
      ARTIFACT_EXPIRE: "1"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "0784d6fdfe93bdc017098f3d8422268f7bafb87e" # patch-7
      SOURCESDK_MINIMAL_64XBRANCH: "7ad3ac0b89a951a73e2e10c70491ed643f5eb4e8" # x86-64-patch-3
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"

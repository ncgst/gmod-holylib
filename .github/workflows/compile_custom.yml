# Keep SDK pins aligned with the supported interface ABI documented in BUILD.md.
name: Build Custom Version

on: 
  workflow_dispatch:
    inputs:
      modules:
        description: 'Space-separated list of modules to keep (e.g., holylib gameevent)'
        required: true
        type: string
      custom_vphysics:
        description: 'Include custom vphysics build'
        required: false
        default: false
        type: boolean

env:
  MODULES_LIST: "autorefresh holylib gameevent serverplugin sourcetv stringtable precachefix pvs surffix filesystem util concommand vprof cvars bitbuf networking networkthreading networkingreplacement steamworks pas bass systimer voicechat physenv net entitylist httpserver gameserver soundscape luajit holylua nw2 crashhandler unholylib gmoddatapack networkdebugging"

jobs:
  build_custom_version:
    runs-on: ubuntu-latest
    outputs:
      COMMAND: ${{ steps.construct_command.outputs.COMMAND }}

    steps:
      - name: Construct the removal command and output it
        id: construct_command
        run: |
          MODULES_SELECTED=(${{ inputs.modules }})

          COMMAND="${{ inputs.custom_vphysics == false && 'rm -rf source/ivp &&' || '' }} cd source/modules && ls | grep -vF -e 'none'"

          for MODULE in "${MODULES_SELECTED[@]}"; do
            if [[ " $MODULES_LIST " =~ " $MODULE " ]]; then
              COMMAND="$COMMAND -e $MODULE.cpp"
            fi
          done

          COMMAND="$COMMAND | xargs rm -f -- && cd ../../"

          echo "Generated Command: $COMMAND"
          echo "COMMAND=$COMMAND" >> "$GITHUB_OUTPUT"

  build_holylib:
    needs: build_custom_version
    uses: ncgst/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      BUILDER_IMAGE_32X: "raphaelit7/gmod-builder@sha256:10ffd1cc385c803831521822a463d40c6e1a544d0c7c6d0e2489560f60343f1a" # latest_32x before 2026-11-02
      BUILDER_IMAGE_64X: "raphaelit7/gmod-builder@sha256:ad67a67b9ffb3e8fe1b20f5a15ce044297c51b3a6c6c9ad00cac9d252fa9255d" # Debian 11, GCC 10.2 (latest_64x before 2026-11-02)
      PROJECT_NAME: "holylib"
      BUILD_64x: "true"
      REALM: "sv"
      LINUX_FILEEXTENTION: "so"
      BUILD_WINDOWS: "false"
      ARTIFACT_EXPIRE: "7"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "0784d6fdfe93bdc017098f3d8422268f7bafb87e" # patch-7
      SOURCESDK_MINIMAL_64XBRANCH: "7ad3ac0b89a951a73e2e10c70491ed643f5eb4e8" # x86-64-patch-3
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "holylib"
      ADDITIONAL_DATA: "1"
      ADDITIONAL_LINUX_32_SETUP: ${{ needs.build_custom_version.outputs.COMMAND }}
      ADDITIONAL_LINUX_64_SETUP: ${{ needs.build_custom_version.outputs.COMMAND }}

  build_ghostinj:
    uses: ncgst/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      BUILDER_IMAGE_32X: "raphaelit7/gmod-builder@sha256:10ffd1cc385c803831521822a463d40c6e1a544d0c7c6d0e2489560f60343f1a" # latest_32x before 2026-11-02
      BUILDER_IMAGE_64X: "raphaelit7/gmod-builder@sha256:ad67a67b9ffb3e8fe1b20f5a15ce044297c51b3a6c6c9ad00cac9d252fa9255d" # Debian 11, GCC 10.2 (latest_64x before 2026-11-02)
      PROJECT_PATH: "ghostinj-dll/"
      PROJECT_NAME: "ghostinj"
      BUILD_64x: "true"
      LINUX_FILEEXTENTION: "dll"
      BUILD_WINDOWS: "false"
      USE_PREFIX: "false"
      ARTIFACT_EXPIRE: "7"
      ADDITIONAL_DATA: "1"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "0784d6fdfe93bdc017098f3d8422268f7bafb87e" # patch-7
      SOURCESDK_MINIMAL_64XBRANCH: "7ad3ac0b89a951a73e2e10c70491ed643f5eb4e8" # x86-64-patch-3
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "holylib"

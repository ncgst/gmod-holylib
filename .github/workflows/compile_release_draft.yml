name: Build Release Draft

on: 
  workflow_dispatch:

jobs:
  build_holylib:
    uses: ncgst/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      PROJECT_NAME: "holylib"
      BUILD_64x: "true"
      REALM: "sv"
      LINUX_FILEEXTENTION: "so"
      BUILD_WINDOWS: "true"
      ARTIFACT_EXPIRE: "7"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "patch-7"
      SOURCESDK_MINIMAL_64XBRANCH: "x86-64-patch-3"
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "holylib"
      ADDITIONAL_DATA: "1"
      UPLOAD_PDB: "true"

  build_holylib_windows_dedicated:
    name: "Build Plugin (Dedicated)"
    uses: ncgst/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      PROJECT_NAME: "holylib"
      BUILD_64x: "true"
      REALM: "sv"
      BUILD_WINDOWS: "true"
      BUILD_LINUX: "false"
      ARTIFACT_EXPIRE: "7"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "patch-7"
      SOURCESDK_MINIMAL_64XBRANCH: "x86-64-patch-3"
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "holylib"
      UPLOAD_PDB: "true"
      BUILD_WINDOWS_DEDICATED: "true"

  build_plugin_windows_64x_main:
    name: "Build Plugin (64x - Main Branch)"
    uses: ncgst/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      PROJECT_NAME: "holylib"
      BUILD_64x: "true"
      BUILD_32x: "false"
      REALM: "sv"
      LINUX_FILEEXTENTION: "so"
      BUILD_WINDOWS: "true"
      BUILD_LINUX: "false"
      ADDITIONAL_POSTARTIFACTNAME: " - Main branch"
      ARTIFACT_EXPIRE: "7"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_64XBRANCH: "patch-7"
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "holylib"
      BUILD_CACHE: "true"
      UPLOAD_PDB: "true"

  build_ghostinj:
    uses: ncgst/gmod-common-module-base/.github/workflows/compile.yml@workflow
    with:
      PROJECT_PATH: "ghostinj-dll/"
      PROJECT_NAME: "ghostinj"
      BUILD_64x: "true"
      LINUX_FILEEXTENTION: "dll"
      BUILD_WINDOWS: "false"
      USE_PREFIX: "false"
      ARTIFACT_EXPIRE: "7"
      ADDITIONAL_DATA: "1"
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "patch-7"
      SOURCESDK_MINIMAL_64XBRANCH: "x86-64-patch-3"
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"

  release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs:
      - build_holylib
      - build_holylib_windows_dedicated
      - build_plugin_windows_64x_main
      - build_ghostinj
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            holylib_linux.vdf
            holylib_linux_64.vdf

      - name: Create artifact directories
        run: |
          mkdir linux32 linux64 win32 win64 win64mainbranch
          mkdir win32dedicated win64dedicated ghostinj32 ghostinj64

      - name: Download gmsv_holylib_linux.so
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_linux.so
          path: linux32

      - name: Download gmsv_holylib_linux64.so
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_linux64.so (64x)
          path: linux64

      - name: Download gmsv_holylib_win32.dll
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_win32.dll
          path: win32

      - name: Download gmsv_holylib_win64.dll
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_win64.dll (64x)
          path: win64

      - name: Download main-branch gmsv_holylib_win64.dll
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_win64.dll (64x) - Main branch
          path: win64mainbranch

      - name: Download dedicated gmsv_holylib_win32.dll
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_win32.dll (Dedicated)
          path: win32dedicated

      - name: Download dedicated gmsv_holylib_win64.dll
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_win64.dll (64x) (Dedicated)
          path: win64dedicated

      - name: Download gmsv_holylib_win32.pdb
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_win32.pdb
          path: win32

      - name: Download gmsv_holylib_win64.pdb
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_win64.pdb (64x)
          path: win64

      - name: Download main-branch gmsv_holylib_win64.pdb
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_win64.pdb (64x) - Main branch
          path: win64mainbranch

      - name: Download dedicated gmsv_holylib_win32.pdb
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_win32.pdb (Dedicated)
          path: win32dedicated

      - name: Download dedicated gmsv_holylib_win64.pdb
        uses: actions/download-artifact@v8
        with:
          name: gmsv_holylib_win64.pdb (64x) (Dedicated)
          path: win64dedicated

      - name: Download 32-bit GhostInj
        uses: actions/download-artifact@v8
        with:
          name: ghostinj.dll
          path: ghostinj32

      - name: Download 64-bit GhostInj
        uses: actions/download-artifact@v8
        with:
          name: ghostinj.dll (64x)
          path: ghostinj64

      - name: Assemble release assets and checksums
        run: |
          mkdir release
          cp linux32/gmsv_holylib_linux.so release/
          cp linux64/gmsv_holylib_linux64.so release/
          cp win32/gmsv_holylib_win32.dll release/
          cp win64/gmsv_holylib_win64.dll release/
          cp win64mainbranch/gmsv_holylib_win64.dll release/gmsv_holylib_win64_main.dll
          cp win32dedicated/gmsv_holylib_win32.dll release/gmsv_holylib_win32_dedicated.dll
          cp win64dedicated/gmsv_holylib_win64.dll release/gmsv_holylib_win64_dedicated.dll
          cp win32/gmsv_holylib_win32.pdb release/
          cp win64/gmsv_holylib_win64.pdb release/
          cp win64mainbranch/gmsv_holylib_win64.pdb release/gmsv_holylib_win64_main.pdb
          cp win32dedicated/gmsv_holylib_win32.pdb release/gmsv_holylib_win32_dedicated.pdb
          cp win64dedicated/gmsv_holylib_win64.pdb release/gmsv_holylib_win64_dedicated.pdb
          cp ghostinj32/ghostinj.dll release/ghostinj.dll
          cp ghostinj64/ghostinj.dll release/ghostinj64.dll
          cp holylib_linux.vdf holylib_linux_64.vdf release/
          (
            cd release
            sha256sum * > SHA256SUMS
          )

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_RUN_ID}" release/* \
            --draft \
            --latest=false \
            --target "${GITHUB_SHA}" \
            --title "Release ${GITHUB_RUN_ID}" \
            --notes "Automated draft release from workflow run ${GITHUB_RUN_ID}."

      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: "*"
          failOnError: false

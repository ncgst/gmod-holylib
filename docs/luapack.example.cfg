// Existing module; still disabled by default in HolyLib.
holylib_enable_gmoddatapack 1

// Conservative staging policy: do not publish unless server.cfg supplied sv_downloadurl.
holylib_gmoddatapack_luapack_downloadurl_policy require
holylib_gmoddatapack_luapack_packdir holylib/luapack
holylib_gmoddatapack_luapack_retention_ttl 300
holylib_gmoddatapack_luapack_object_retention_ttl 604800
holylib_gmoddatapack_luapack_ready_deadline 180
holylib_gmoddatapack_luapack_downloadable_limit 1

// Required mode currently needs the complete Linux registration, SendServerInfo,
// request-batch, and body-selection hook set. If any hook is unavailable,
// required=1 rejects every join
// before evaluating opt-out; Windows x64 is build-only for required mode.
// Stage with 0; switch to 1 only after the immutable map base is confirmed in the
// engine download queue and reachable on FastDL.
// Later hotfixes remain native deltas and do not consume another downloadable slot.
holylib_gmoddatapack_luapack_required 0
holylib_gmoddatapack_luapack_allow_optout 1

// Permit one authenticated, server-driven reconnect into a wholly native next baseline
// after an exact required-generation failure. No failed join switches lanes in progress.
holylib_gmoddatapack_luapack_required_recovery 1
holylib_gmoddatapack_luapack_required_recovery_ttl 120

// Bound cold required placeholder work globally per server frame. Raise only after
// measuring CNetChan::ProcessMessages during concurrent cold joins.
holylib_gmoddatapack_luapack_required_stub_budget 32

// SendServerInfo serializes the complete Lua string-table baseline atomically.
// Keep one admitted LuaPack baseline per frame for the first production canary.
// This schedules already-accepted physical and parked clients; it is not a second
// gameplay/connection queue. Raise only after concurrent-join timing evidence.
holylib_gmoddatapack_luapack_serverinfo_budget 1

// Persist a compact server-log split when LuaPack preparation + engine ServerInfo
// reaches this threshold. Set 0 only for a supervised all-join measurement window.
holylib_gmoddatapack_luapack_baseline_warn_ms 10

// Required mode supersedes optimistic join stubbing. Keep speculation off unless
// separately testing the legacy fail-open lane.
holylib_gmoddatapack_luapack_optimistic 0

// Optional ingest is empty by default. Existing mirror/CDN pipelines can watch the data directory.
holylib_gmoddatapack_luapack_ingest_url ""
holylib_gmoddatapack_luapack_ingest_method PUT

// Enable only after the object is reachable at <sv_downloadurl>/data/holylib/luapack/.
holylib_gmoddatapack_luapack_enable 0

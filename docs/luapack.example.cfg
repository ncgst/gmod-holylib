// Existing module; still disabled by default in HolyLib.
holylib_enable_gmoddatapack 1

// Conservative staging policy: do not publish unless server.cfg supplied sv_downloadurl.
holylib_gmoddatapack_luapack_downloadurl_policy require
holylib_gmoddatapack_luapack_packdir holylib/luapack
holylib_gmoddatapack_luapack_retention_ttl 300
holylib_gmoddatapack_luapack_object_retention_ttl 604800
holylib_gmoddatapack_luapack_ready_deadline 180
holylib_gmoddatapack_luapack_downloadable_limit 1

// Required mode is fail-closed. Stage with 0; switch to 1 only after the current
// generation is confirmed in the engine download queue and reachable on FastDL.
// With limit 1, schedule a level change before admitting required joins after a hotfix.
holylib_gmoddatapack_luapack_required 0
holylib_gmoddatapack_luapack_allow_optout 1

// Required mode supersedes optimistic join stubbing. Keep speculation off unless
// separately testing the legacy fail-open lane.
holylib_gmoddatapack_luapack_optimistic 0

// Optional ingest is empty by default. Existing mirror/CDN pipelines can watch the data directory.
holylib_gmoddatapack_luapack_ingest_url ""
holylib_gmoddatapack_luapack_ingest_method PUT

// Enable only after the object is reachable at <sv_downloadurl>/data/holylib/luapack/.
holylib_gmoddatapack_luapack_enable 0
